<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safari Evrim - Multiplayer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="screen-login" class="login-screen active">
    <div class="login-card">
      <h1>🦁 Safari Evrim</h1>
      <p class="subtitle">En güçsüz hayvan olarak başla, çiftleş, evrimleş.</p>
      <label for="nickname">Nickname</label>
      <input id="nickname" maxlength="20" placeholder="Adını yaz..." autocomplete="off">
      <button id="btn-join" class="btn primary">Safariye Katıl</button>
      <p id="login-error" class="error"></p>
      <p class="hint">Yön tuşları (veya WASD): Hareket &nbsp;•&nbsp; Space: Çiftleş</p>
    </div>
  </section>

  <section id="screen-game" class="game-screen">
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="hud-card">
        <div class="hud-animal">
          <span id="hud-emoji" class="hud-emoji"></span>
          <div>
            <div id="hud-name" class="hud-name"></div>
            <div id="hud-score" class="hud-score"></div>
          </div>
        </div>
        <div class="progress"><div id="hud-progress-bar" class="progress-bar"></div></div>
        <div id="hud-unlock" class="hud-unlock" hidden>🔓 Üst kademeyle çiftleşme açık</div>
      </div>
    </div>

    <div class="controls-hint">Yön tuşları: Hareket &nbsp;•&nbsp; Space: Çiftleş</div>

    <div id="toast" class="toast"></div>

    <div id="mating-banner" class="mating-banner">
      <span id="mating-banner-text">Çiftleşiyor...</span>
      <div class="mating-banner-progress"><div id="mating-banner-bar" class="mating-banner-bar"></div></div>
    </div>

    <div class="minimap-wrap">
      <canvas id="minimap" width="170" height="170"></canvas>
      <div class="minimap-hint">▲ üste tıkla: yaklaştır &nbsp;•&nbsp; ▼ alta tıkla: uzaklaştır</div>
    </div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>
